SERIAL 0 115200
PROMPT 1
TIMEOUT 50
DEFAULT floppy
SAY Floppy Linux - press Enter (or wait 5 s) for "floppy", type "serial" for COM1.

LABEL floppy
  KERNEL bzImage
  APPEND initrd=init.cpio.lzma rdinit=/sh

LABEL serial
  KERNEL bzImage
  APPEND initrd=init.cpio.lzma rdinit=/sh console=ttyS0,115200
